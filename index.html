<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WikiMind BAC 2026 - Calculateur de Moyenne</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #ffffff;
            --text: #111111;
            --accent: #000000;
            --border: #e5e7eb;
            --card-bg: #f9fafb;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        /* Animations */
        .fade-in { animation: fadeIn 0.5s ease-out forwards; opacity: 0; transform: translateY(10px); }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        .input-group { transition: all 0.2s; }
        .input-group:focus-within { transform: scale(1.01); }
        
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }

        /* WikiMind Branding Style */
        .wikimind-btn {
            background-color: var(--accent);
            color: white;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .wikimind-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .result-card {
            background: black;
            color: white;
            transition: 0.3s;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="border-b border-gray-200 sticky top-0 bg-white/90 backdrop-blur-md z-50">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-black rounded-lg flex items-center justify-center text-white font-black text-sm">W</div>
                <h1 class="text-xl font-black tracking-tighter uppercase italic">WikiMind <span class="text-gray-400 not-italic font-medium">BAC</span></h1>
            </div>
            
            <a href="https://chpalitom09-bot.github.io/Wikimind/" target="_blank" 
               class="group flex items-center gap-2 text-sm font-medium hover:text-black transition-colors">
                <span class="text-gray-500 group-hover:text-black transition">Besoin d'aide ?</span>
                <span class="bg-gray-100 px-3 py-1.5 rounded-full font-bold border border-gray-200 group-hover:bg-black group-hover:text-white group-hover:border-black transition duration-300">
                    Parler à @WikiMind
                </span>
            </a>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-grow max-w-4xl mx-auto w-full px-6 py-12">
        
        <!-- INTRO -->
        <div class="text-center mb-12 fade-in" style="animation-delay: 0.1s;">
            <h2 class="text-4xl md:text-5xl font-black mb-4 tracking-tight">Simulateur BAC 2026</h2>
            <p class="text-gray-500">Calcul de moyenne précis avec coefficients officiels.</p>
        </div>

        <!-- SELECTOR -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-10 fade-in" style="animation-delay: 0.2s;">
            <button onclick="setMode('general')" id="btn-general" class="stream-btn p-6 rounded-2xl border-2 border-black bg-black text-white text-left hover:scale-[1.02] transition">
                <div class="text-2xl mb-2">🎓</div>
                <div class="font-bold text-lg">Général</div>
                <div class="text-xs opacity-70">Réforme 2026 standard</div>
            </button>
            <button onclick="setMode('bachibac')" id="btn-bachibac" class="stream-btn p-6 rounded-2xl border-2 border-gray-100 hover:border-black bg-white text-black text-left hover:scale-[1.02] transition">
                <div class="text-2xl mb-2">🇪🇸</div>
                <div class="font-bold text-lg">BachiBac</div>
                <div class="text-xs text-gray-400">Section Binationale</div>
            </button>
            <button onclick="setMode('pro')" id="btn-pro" class="stream-btn p-6 rounded-2xl border-2 border-gray-100 hover:border-black bg-white text-black text-left hover:scale-[1.02] transition">
                <div class="text-2xl mb-2">🛠️</div>
                <div class="font-bold text-lg">Techno / Pro</div>
                <div class="text-xs text-gray-400">Coefficients modulables</div>
            </button>
        </div>

        <!-- FORM CONTAINER -->
        <div id="calculator-container" class="fade-in hidden" style="animation-delay: 0.3s;">
            
            <div class="flex justify-between items-end mb-6 border-b border-gray-100 pb-2">
                <h3 class="font-bold text-xl uppercase tracking-widest" id="mode-title">Matières</h3>
                <span class="text-xs font-mono bg-gray-100 px-2 py-1 rounded text-gray-500">Note / 20</span>
            </div>

            <!-- DYNAMIC INPUTS GRID -->
            <div id="inputs-grid" class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4">
                <!-- Javascript will populate this -->
            </div>

        </div>

    </main>

    <!-- FIXED FOOTER RESULT -->
    <div id="result-bar" class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-6 transform translate-y-full transition-transform duration-500 shadow-[0_-10px_40px_rgba(0,0,0,0.1)] z-40">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <div class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Moyenne Estimée</div>
                <div class="flex items-baseline gap-3">
                    <span id="final-grade" class="text-5xl font-black tracking-tighter">--/20</span>
                    <span id="final-mention" class="px-3 py-1 rounded-full bg-black text-white text-xs font-bold uppercase hidden">Mention ?</span>
                </div>
            </div>
            
            <div class="flex gap-3 w-full md:w-auto">
                 <button onclick="resetCalculator()" class="flex-1 md:flex-none border border-gray-200 hover:border-black hover:bg-gray-50 px-6 py-3 rounded-xl font-bold text-sm uppercase transition">
                    Réinitialiser
                </button>
                <a href="https://chpalitom09-bot.github.io/Wikimind/" target="_blank" class="flex-1 md:flex-none wikimind-btn px-6 py-3 rounded-xl font-bold text-sm uppercase flex items-center justify-center gap-2">
                    <span>Analyser avec IA</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
                </a>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURATION DES COEFFICIENTS (BAC 2026)
        const DATA = {
            general: [
                { category: "Épreuves Terminales (60%)" },
                { name: "Français (Écrit)", coef: 5 },
                { name: "Français (Oral)", coef: 5 },
                { name: "Philosophie", coef: 8 },
                { name: "Grand Oral", coef: 10 },
                { name: "Spécialité 1 (Terminale)", coef: 16 },
                { name: "Spécialité 2 (Terminale)", coef: 16 },
                
                { category: "Contrôle Continu (40%)" },
                { name: "Spécialité abandonnée (1ère)", coef: 8 },
                { name: "Histoire-Géo (Moyenne 1ère+Term)", coef: 6 },
                { name: "LVA (Moyenne 1ère+Term)", coef: 6 },
                { name: "LVB (Moyenne 1ère+Term)", coef: 6 },
                { name: "Enseignement Scientifique", coef: 6 },
                { name: "EPS", coef: 6 },
                { name: "EMC", coef: 2 }
            ],
            bachibac: [
                { category: "Épreuves Spécifiques BachiBac" },
                { name: "Langue et Littérature (Écrit)", coef: 10, info: "Remplace LVA" }, // Approx coef LVA global + spécifique
                { name: "Langue et Littérature (Oral)", coef: 10 },
                { name: "Hist-Géo Espagnol (Écrit+Oral)", coef: 15, info: "Remplace Hist-Géo TC" },

                { category: "Épreuves Communes" },
                { name: "Français (Écrit)", coef: 5 },
                { name: "Français (Oral)", coef: 5 },
                { name: "Philosophie", coef: 8 },
                { name: "Grand Oral", coef: 10 }, /* Note: Parfois aménagé en BachiBac, on garde le standard */
                { name: "Spécialité 1 (Terminale)", coef: 16 },
                { name: "Spécialité 2 (Terminale)", coef: 16 },
                
                { category: "Contrôle Continu" },
                { name: "Spécialité abandonnée (1ère)", coef: 8 },
                { name: "LVB (Moyenne 1ère+Term)", coef: 6 },
                { name: "Enseignement Scientifique", coef: 6 },
                { name: "EPS", coef: 6 },
                { name: "EMC", coef: 2 }
            ],
            pro: [
                { category: "Enseignements Généraux" },
                { name: "Français / Histoire-Géo", coef: 5 },
                { name: "Maths / Sciences", coef: 5 },
                { name: "LVA", coef: 4 },
                { name: "LVB", coef: 4 },
                { name: "Arts Appliqués", coef: 2 },
                { name: "EPS", coef: 4 },
                
                { category: "Enseignements Professionnels" },
                { name: "Chef d'œuvre", coef: 4 },
                { name: "Épreuve Pro (EP1 - Pratique)", coef: 12 },
                { name: "Épreuve Pro (EP2 - Dossier)", coef: 8 },
                { name: "Économie - Gestion / Droit", coef: 2 },
                { name: "Prévention Santé Env.", coef: 2 }
            ]
        };

        let currentMode = null;

        function setMode(mode) {
            currentMode = mode;
            
            // UI Updates
            document.querySelectorAll('.stream-btn').forEach(btn => {
                btn.classList.remove('bg-black', 'text-white', 'border-black');
                btn.classList.add('bg-white', 'text-black', 'border-gray-100');
            });
            const activeBtn = document.getElementById(`btn-${mode}`);
            activeBtn.classList.remove('bg-white', 'text-black', 'border-gray-100');
            activeBtn.classList.add('bg-black', 'text-white', 'border-black');

            // Show Calculator
            const container = document.getElementById('calculator-container');
            container.classList.remove('hidden');
            
            // Set Title
            const titles = { general: "Bac Général", bachibac: "Section BachiBac", pro: "Bac Pro / Techno" };
            document.getElementById('mode-title').innerText = titles[mode];

            renderInputs(mode);
            
            // Scroll to calculator
            setTimeout(() => {
                container.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
            
            // Show result bar
            document.getElementById('result-bar').classList.remove('translate-y-full');
            updateCalculation();
        }

        function renderInputs(mode) {
            const grid = document.getElementById('inputs-grid');
            grid.innerHTML = '';

            DATA[mode].forEach((item, index) => {
                if (item.category) {
                    const separator = document.createElement('div');
                    separator.className = "md:col-span-2 mt-4 mb-2 pb-1 border-b border-gray-100";
                    separator.innerHTML = `<h4 class="font-bold text-xs text-gray-400 uppercase tracking-widest">${item.category}</h4>`;
                    grid.appendChild(separator);
                } else {
                    const div = document.createElement('div');
                    div.className = "input-group flex items-center justify-between bg-gray-50 p-4 rounded-xl border border-transparent hover:border-gray-200 hover:bg-white";
                    
                    div.innerHTML = `
                        <div class="flex flex-col">
                            <label class="font-bold text-sm leading-tight">${item.name}</label>
                            <span class="text-xs text-gray-400 font-mono mt-1">Coef. ${item.coef} ${item.info ? '• ' + item.info : ''}</span>
                        </div>
                        <input type="number" 
                            min="0" max="20" step="0.1" 
                            placeholder="-"
                            class="grade-input w-20 text-right font-black text-lg bg-transparent border-b border-gray-300 focus:border-black outline-none transition-colors p-1"
                            data-coef="${item.coef}"
                            oninput="updateCalculation()">
                    `;
                    grid.appendChild(div);
                }
            });
        }

        function updateCalculation() {
            const inputs = document.querySelectorAll('.grade-input');
            let totalPoints = 0;
            let totalCoef = 0;
            let filled = false;

            inputs.forEach(input => {
                const val = parseFloat(input.value);
                const coef = parseFloat(input.dataset.coef);
                
                if (!isNaN(val)) {
                    filled = true;
                    // Clamp value between 0 and 20 visualy logic
                    if(val < 0) input.value = 0;
                    if(val > 20) input.value = 20;
                    
                    totalPoints += val * coef;
                    totalCoef += coef;
                } else {
                    // Si pas de note, on n'ajoute pas au calcul (simulation de moyenne provisoire)
                    // Optionnel : Si on veut une simulation "zéro si vide", décommenter :
                    // totalCoef += coef;
                }
            });

            const display = document.getElementById('final-grade');
            const mentionTag = document.getElementById('final-mention');
            
            if (totalCoef === 0 || !filled) {
                display.innerText = "--/20";
                mentionTag.classList.add('hidden');
                return;
            }

            const average = totalPoints / totalCoef;
            const averageFormatted = average.toFixed(2);
            
            // Animation compteur simple
            display.innerText = averageFormatted + "/20";

            // Mention Logic
            mentionTag.classList.remove('hidden', 'bg-red-500', 'bg-yellow-500', 'bg-blue-500', 'bg-green-500', 'bg-purple-600', 'bg-black');
            
            if (average < 8) {
                mentionTag.innerText = "Refusé";
                mentionTag.className = "px-3 py-1 rounded-full text-white text-xs font-bold uppercase bg-red-500";
            } else if (average < 10) {
                mentionTag.innerText = "Rattrapage";
                mentionTag.className = "px-3 py-1 rounded-full text-white text-xs font-bold uppercase bg-yellow-500";
            } else if (average < 12) {
                mentionTag.innerText = "Admis sans mention";
                mentionTag.className = "px-3 py-1 rounded-full text-white text-xs font-bold uppercase bg-blue-500";
            } else if (average < 14) {
                mentionTag.innerText = "Mention Assez Bien";
                mentionTag.className = "px-3 py-1 rounded-full text-white text-xs font-bold uppercase bg-green-500";
            } else if (average < 16) {
                mentionTag.innerText = "Mention Bien";
                mentionTag.className = "px-3 py-1 rounded-full text-white text-xs font-bold uppercase bg-black";
            } else {
                mentionTag.innerText = "Mention Très Bien";
                mentionTag.className = "px-3 py-1 rounded-full text-white text-xs font-bold uppercase bg-purple-600 shadow-lg shadow-purple-200";
            }
        }

        function resetCalculator() {
            document.querySelectorAll('.grade-input').forEach(i => i.value = '');
            updateCalculation();
        }

    </script>
</body>
</html>
